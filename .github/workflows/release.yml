name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Signed when the repository has the keystore secrets; otherwise the APK is unsigned (still useful to inspect).
      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FRAMELOCK_KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "FRAMELOCK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - run: ./gradlew check assembleRelease --console=plain
        env:
          FRAMELOCK_KEYSTORE_PASSWORD: ${{ secrets.FRAMELOCK_KEYSTORE_PASSWORD }}
          FRAMELOCK_KEY_ALIAS: ${{ secrets.FRAMELOCK_KEY_ALIAS }}
          FRAMELOCK_KEY_PASSWORD: ${{ secrets.FRAMELOCK_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: framelock-${{ github.ref_name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90
