name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v6

      # check = unit tests, Konsist, module boundaries, build-logic TestKit tests, Spotless/ktlint, detekt, Lint.
      - run: ./gradlew check assembleDebug --console=plain

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
